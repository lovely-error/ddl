name: Release

on:
  push:
    tags:
      - 'v*'
  schedule:
    # Run nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      is_nightly:
        description: 'Build as nightly pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "release_tag=$TAG" >> $GITHUB_OUTPUT
            echo "release_name=DDL $TAG" >> $GITHUB_OUTPUT
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          else
            DATE=$(date +'%Y-%m-%d')
            echo "release_tag=nightly" >> $GITHUB_OUTPUT
            echo "release_name=DDL Nightly Build ($DATE)" >> $GITHUB_OUTPUT
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build - ${{ matrix.target }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (Statically linked with musl, runs on any Linux distribution)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: ddl
            archive: tar.gz
            use_cross: false

          # Linux aarch64 (ARM64, cross-compiled)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: ddl
            archive: tar.gz
            use_cross: true

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ddl.exe
            archive: zip
            use_cross: false

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-14
            target: aarch64-apple-darwin
            binary: ddl
            archive: tar.gz
            use_cross: false

          # macOS Intel (x86_64)
          - os: macos-13
            target: x86_64-apple-darwin
            binary: ddl
            archive: tar.gz
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-25
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (for ARM64 Linux)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release assets
        shell: bash
        run: |
          TAG="${{ needs.setup.outputs.release_tag }}"
          PKG_NAME="ddl-${TAG}-${{ matrix.target }}"
          mkdir -p "pkg/$PKG_NAME"

          # Copy executable and documentation
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "pkg/$PKG_NAME/"
          cp README.md "pkg/$PKG_NAME/"
          [ -f desc.md ] && cp desc.md "pkg/$PKG_NAME/"
          [ -f LICENSE ] && cp LICENSE "pkg/$PKG_NAME/"

          cd pkg
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../$PKG_NAME.zip" "$PKG_NAME"
            echo "ASSET_PATH=$PKG_NAME.zip" >> $GITHUB_ENV
          else
            tar -czvf "../$PKG_NAME.tar.gz" "$PKG_NAME"
            echo "ASSET_PATH=$PKG_NAME.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}

  publish:
    name: Publish Release
    needs: [setup, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 Checksums
        working-directory: artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.release_tag }}
          name: ${{ needs.setup.outputs.release_name }}
          prerelease: ${{ needs.setup.outputs.is_prerelease }}
          make_latest: ${{ needs.setup.outputs.is_prerelease == 'false' }}
          generate_release_notes: ${{ needs.setup.outputs.is_prerelease == 'false' }}
          files: |
            artifacts/*
