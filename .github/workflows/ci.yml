name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-25

      - name: Run unit & integration tests
        run: cargo test

  lint:
    name: Lint & Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-25
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build DDL
        run: cargo build

      - name: Check example formatting with ddl fmt
        run: ./target/debug/ddl fmt --check examples/*.ddl

  # A REQUIRED job, and one that cannot pass by not running.
  #
  # The Verilator test skips when the tool is missing or its data directory is
  # broken, which is right on a developer's machine and wrong here: cargo hides
  # a passing test's stderr, so the `SKIP` went unseen and the workflow was
  # green having linted nothing. Nothing else in CI looked at the generated
  # RTL at all. `DDL_REQUIRE_VERILATOR=1` turns those skips into failures, so
  # this job distinguishes passed from skipped from failed.
  rtl:
    name: Generated RTL (Verilator)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-25

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      # Named in the log, so a lint result can be tied to a version later.
      - name: Report Verilator version
        run: verilator --version

      # Both halves, and the order matters. The freshness test ties the
      # checked-in `.v` to the compiler in this commit; without it the linter
      # would be judging whatever the compiler used to emit. The lint itself
      # then runs with skips promoted to failures.
      - name: Lint the generated Verilog, and check it is current
        env:
          DDL_REQUIRE_VERILATOR: '1'
        run: cargo test --locked --test lint
